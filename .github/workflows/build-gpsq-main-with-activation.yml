name: Build GPSQ Main With Activation UI

on:
  workflow_dispatch:
  push:
    branches: [main, feature/gpsq-activation-system]
    paths:
      - 'Makefile'
      - 'FakeGPS.mm'
      - 'SharedBridge.xm'
      - 'FeaturePack.xm'
      - 'LocationSpoof.xm'
      - 'gpsq.plist'
      - 'FakeGPSLocation.plist'
      - 'integrations/gpsq-activation/Sources/GPSQActivation.mm'
      - '.github/workflows/build-gpsq-main-with-activation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Makefile'
      - 'FakeGPS.mm'
      - 'SharedBridge.xm'
      - 'FeaturePack.xm'
      - 'LocationSpoof.xm'
      - 'gpsq.plist'
      - 'FakeGPSLocation.plist'
      - 'integrations/gpsq-activation/Sources/GPSQActivation.mm'
      - '.github/workflows/build-gpsq-main-with-activation.yml'

permissions:
  contents: read

jobs:
  build-main:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Validate activation integration
        run: |
          set -Eeuo pipefail
          test -f Makefile
          test -f integrations/gpsq-activation/Sources/GPSQActivation.mm
          grep -q 'integrations/gpsq-activation/Sources/GPSQActivation.mm' Makefile
          grep -q 'Security' Makefile
          grep -q 'key.p3nd.fun/activation/api' integrations/gpsq-activation/Sources/GPSQActivation.mm
          grep -q 'GPProjectKey = @"gpsq"' integrations/gpsq-activation/Sources/GPSQActivation.mm

      - name: Build main package
        run: |
          set -Eeuo pipefail
          make clean || true
          make package FINALPACKAGE=1 -j1 2>&1 | tee build-main.log

      - name: Collect main artifacts
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          find packages -type f -name '*.deb' -exec cp -v {} artifacts/ \;
          find .theos -type f -name 'gpsq.dylib' -exec cp -v {} artifacts/ \;
          find .theos -type f -name 'FakeGPSLocation.dylib' -exec cp -v {} artifacts/ \;
          cp build-main.log artifacts/
          test -n "$(find artifacts -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find artifacts -maxdepth 1 -type f -name 'gpsq.dylib' -print -quit)"
          sha256sum artifacts/*.deb artifacts/*.dylib > artifacts/SHA256SUMS.txt
          ls -lah artifacts

      - name: Upload main artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GPSQ-Main-With-Activation-${{ github.run_number }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 30
